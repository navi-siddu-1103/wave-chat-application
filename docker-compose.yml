version: '3.8'

services:
  # MongoDB database
  mongodb:
    image: mongo:7.0-alpine
    container_name: wave-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: wave
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wave-network

  # Next.js application
  app:
    build: .
    container_name: wave-app
    ports:
      - "3000:3000"
      - "9002:3000"
    environment:
      NODE_ENV: production
      MONGODB_URI: ******mongodb:27017/wave?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key-min-32-characters-long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-jwt-refresh-secret-key-min-32-characters-long}
      JWT_EXPIRATION: 7d
      JWT_REFRESH_EXPIRATION: 30d
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-nextauth-secret-key-min-32-characters-long}
      NEXTAUTH_URL: http://localhost:9002
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:9002,http://127.0.0.1:3000,http://127.0.0.1:9002
      LOG_LEVEL: INFO
      ENABLE_RATE_LIMITING: "true"
      ENABLE_CSRF_PROTECTION: "true"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - wave-network
    restart: unless-stopped

  # Optional: MongoDB UI (Mongo Express)
  mongo-express:
    image: mongo-express:latest
    container_name: wave-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: ******mongodb:27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: pass
    depends_on:
      - mongodb
    networks:
      - wave-network
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local

networks:
  wave-network:
    driver: bridge
